name: API documentation

on:
  push:
    branches:
      - main
    paths:
      - '.config/dotnet-tools.json'
      - '.editorconfig'
      - 'Directory.Build.props'
      - 'docs/api/**'
      - 'external/**'
      - 'global.json'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  wiki:
    name: Publish API reference to the wiki
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.113

      - name: Restore tools and locked dependencies
        run: |
          dotnet tool restore
          dotnet restore Melanopsin.slnx --locked-mode

      - name: Generate API reference
        run: pwsh -NoProfile -File docs/api/generate.ps1 -OutputRoot artifacts/docs/api

      - name: Convert generated pages into wiki pages
        run: pwsh -NoProfile -File docs/api/prepare-wiki.ps1 -SourceRoot artifacts/docs/api -DestinationRoot artifacts/wiki

      - name: Upload API reference pages
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: api-reference-wiki
          path: artifacts/wiki
          if-no-files-found: error

      - name: Publish to the wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: pwsh -NoProfile -File docs/api/publish-wiki.ps1 -SourceRoot artifacts/wiki
